# TCR (Twenty City Runners) Supabase Configuration
# Bu dosya Supabase Local Development için kullanılır

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://localhost"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
redirect_uri = ""

[auth.external.apple]
enabled = true
client_id = "env(APPLE_CLIENT_ID)"
secret = "env(APPLE_CLIENT_SECRET)"
redirect_uri = ""

[analytics]
enabled = false
port = 54327
vector_port = 54328

# Edge Functions: `supabase functions deploy <ad>` bu ayarları kullanır.
# verify_jwt = false olanlar kendi yetki kontrolünü yapar veya dış servisten (Strava, Garmin) çağrılır.
[functions.strava-webhook]
verify_jwt = false

[functions.strava-enrich]
verify_jwt = true

[functions.strava-backfill]
verify_jwt = true

[functions.strava-auth]
verify_jwt = false

[functions.strava-public-config]
verify_jwt = false

[functions.strava-watch-reminder]
verify_jwt = true

[functions.send-push-on-notification]
verify_jwt = true

[functions.garmin-auth]
verify_jwt = false

[functions.garmin-disconnect]
verify_jwt = false

[functions.garmin-push-workout]
verify_jwt = false

[functions.event-results-import]
verify_jwt = false

[functions.event-results-template]
verify_jwt = false

[functions.monthly-program-import]
verify_jwt = false

[functions.monthly-program-template]
verify_jwt = false

[functions.weekly-program-upsert]
verify_jwt = false

[functions.partner-redeem]
verify_jwt = false
